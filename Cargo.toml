[workspace]
resolver = "3"
members = ["ss-proto", "ss", "ss-ipc"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
# errors are enumerated by thiserror types in each signature; per-function prose would repeat them
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
